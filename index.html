<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffc0d9, #fff0f6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: white;
            width: 90%;
            max-width: 500px;
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.2);
        }

        h1 {
            color: #d63384;
            font-size: 45px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }

        .boton {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #d63384;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
        }

        .boton:hover {
            background-color: #ad2168;
            transform: scale(1.05);
        }

        footer {
            margin-top: 30px;
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>¡Hola Mundo! 🌸</h1>

        <p>
            Mi primera página web desplegada automáticamente
            desde GitHub utilizando GitHub Pages.
        </p>

        <a class="boton" href="https://github.com/" target="_blank">
            Visitar GitHub
        </a>

        <footer>
            Práctica de DevOps - GitHub Pages
        </footer>
    </div>

</body>
</html>
